name: Build Android NDK APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: nmkataoka/setup-ndk@v1
        with:
          ndk-version: r26b

      - name: Setup CMake & Ninja
        uses: jvm-repo-rebuild/setup-cmake@v1
        with:
          cmake-version: '3.22.1'

      - name: Build Native C++ (ARM64-v8a)
        run: |
          mkdir -p build_arm64
          cd build_arm64
          cmake .. \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -GNinja
          ninja

      - name: Upload Native Binary Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shaolin-monks-arm64-binary
          path: build_arm64/libshaolin_monks.so
