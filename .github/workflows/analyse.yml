name: Analyze Xbox Executable (XBE)

on:
  workflow_dispatch: # Permite rodar manualmente na aba Actions do GitHub

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Ambiente Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Executar Análise do XBE
        run: |
          echo "=== Iniciando análise do XBE na nuvem ==="
          python tools/analyse_xbe.py game/default.xbe xbe_info.json

      - name: Salvar Relatório de Análise como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: xbe-analysis-report
          path: xbe_info.json
